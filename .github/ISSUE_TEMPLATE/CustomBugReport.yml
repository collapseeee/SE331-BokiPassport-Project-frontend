name: Bug Report
description: Report an encountered bug here!
title: "[BUG]: "
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Auth Pages (Login/Register)
        - Admin Pages (User/Level/Question)
        - User Pages (Profile/Exam/ELearning)
        - API Integration (Services/Interceptors)
        - Routing & Guards
        - UI/UX & Styling
        - State Management (Pinia)
        - Deployment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to ....
        2. Click ....
        3. Refresh ....
    validations:
      required: true
  - type: input
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Ideal output.
    validations:
      required: true
  - type: input
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Actual output.
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add visual evidence, browser console output, or logs here.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (app crashes / feature unusable)
        - High (feature broken)
        - Medium (feature partially works)
        - Low (cosmetic / minor)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - MacOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Opera
        - Samsung Browser
        - Microsoft Edge
        - Safari
        - Brave
        - Firefox
        - Other
    validations:
      required: true
